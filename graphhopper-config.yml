graphhopper:
  datareader.file: pakistan-260224.osm.pbf
  graph.location: pakistan-ghrouting
  graph.encoded_values: car_access, car_average_speed

  import.osm.ignored_highways: [footway, cycleway, path, pedestrian, steps, platform, track]

  profiles:
    - name: car
      custom_model_files: [car.json]

  profiles_ch:
    - profile: car

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  level: WARN
